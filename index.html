<!doctype html>
<!--
      ภาษาของเปลือกหน้าเว็บต้องเป็นอังกฤษให้ตรงกับค่าเริ่มต้นของแอป
      เพราะนี่คือสิ่งที่โปรแกรมอ่านหน้าจออ่านก่อน React จะทำงาน
      ถ้าตั้งเป็นไทยไว้ ผู้ใช้จะได้ยินไทยตั้งแต่วินาทีที่เปิดลิงก์แม้แอปจะเป็นอังกฤษ
      เมื่อผู้ใช้เลือกไทย โค้ดใน i18n จะเปลี่ยน lang กับ title ให้เอง
    -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/icon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f52ab" />
    <!-- ให้เปิดแบบเต็มจอเหมือนแอปเมื่อเพิ่มลงหน้าจอโฮมบน iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ta Tip" />
    <meta
      name="description"
      content="Ta Tip Navigator — voice navigation for people with visual impairment, in English and Thai"
    />
    <title>Ta Tip Navigator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
